name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vendor-independent-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.3"
          cache: false
      - name: Compile Python sources
        run: python -m compileall -q alpr_runner tests tools
      - name: Install hash-locked evidence-only FFmpeg runtime
        run: >-
          umask 077 &&
          python -m pip install
          --disable-pip-version-check
          --no-deps
          --require-hashes
          --only-binary=:all:
          --target .t/media-evidence-runtime
          -r requirements-media-evidence.lock
      - name: Run vendor-independent contracts
        run: python -m unittest discover -s tests -v
      - name: Verify README evidence is byte-current
        run: python -S tools/render_readme_visuals.py --check
