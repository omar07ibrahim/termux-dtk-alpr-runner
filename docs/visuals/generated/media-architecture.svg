  <title id="media-architecture-title">Verified media delivery architecture</title>
  <desc id="media-architecture-description">An explanatory architecture diagram showing the byte path from the numeric recipe through standard-library Y4M rendering, sealed descriptors, the pinned FFmpeg executable, production supervision, and exact RGB receipt-bound artifacts. DTK recognition is outside the executed boundary.</desc>
